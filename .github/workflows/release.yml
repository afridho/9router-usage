name: Release Windows and Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run tauri build
      - name: Build Microsoft Store MSIX
        shell: pwsh
        run: .\scripts\build-msix.ps1 -Version ("${{ github.ref_name }}" -replace '^v', '') -SkipBuild
      - name: Create portable package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $portableDir = "dist/9Router-Usage-$version-portable-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri/target/release/router-usage.exe" "$portableDir/9Router Usage.exe"
          @"
          9Router Usage $version — Portable

          Run "9Router Usage.exe" directly; installation is not required.
          Settings are stored in %APPDATA%\9RouterUsage and passwords, when enabled,
          are stored securely in Windows Credential Manager.
          "@ | Set-Content "$portableDir/README.txt"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "dist/9Router-Usage-$version-portable-x64.zip"
      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe','.msi' }
            Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip','.msix' }
          )
          $files | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            dist/*-portable-x64.zip
            dist/*-store-x64.msix
            checksums.txt

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Check Rust backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Linux packages
        run: npm run tauri build -- --bundles deb,rpm,appimage
      - name: Create Linux checksums
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 | sort -z | while IFS= read -r -d '' package; do
            hash=$(sha256sum "$package" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$hash" "$(basename "$package")"
          done > checksums-linux.txt
      - name: Publish Linux release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            checksums-linux.txt
