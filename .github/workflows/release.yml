name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run tauri build
      - name: Build Microsoft Store MSIX
        shell: pwsh
        run: .\scripts\build-msix.ps1 -Version ("${{ github.ref_name }}" -replace '^v', '') -SkipBuild
      - name: Create portable package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $portableDir = "dist/9Router-Usage-$version-portable-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri/target/release/router-usage.exe" "$portableDir/9Router Usage.exe"
          @"
          9Router Usage $version — Portable

          Run "9Router Usage.exe" directly; installation is not required.
          Settings are stored in %APPDATA%\9RouterUsage and passwords, when enabled,
          are stored securely in Windows Credential Manager.
          "@ | Set-Content "$portableDir/README.txt"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "dist/9Router-Usage-$version-portable-x64.zip"
      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe','.msi' }
            Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip','.msix' }
          )
          $files | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            dist/*-portable-x64.zip
            dist/*-store-x64.msix
            checksums.txt
